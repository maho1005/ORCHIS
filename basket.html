<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ORCHIS | Kurv</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="css/index.css" />
    <link rel="stylesheet" href="css/basket.css" />

    <script src="js/basket.js" defer></script>
  </head>

  <body class="cart-page">
    <header class="header">
      <a href="index.html" class="logo" aria-label="ORCHIS – forsiden">
        <img src="images/logo.webp" alt="ORCHIS" />
      </a>

      <nav class="navigation" aria-label="Hovednavigation">
        <a href="productlist.html">Shop</a>

        <a href="basket.html" class="kurv" aria-label="Min kurv" aria-current="page">
          <img src="images/basket.png" alt="" />
        </a>
      </nav>
    </header>

    <main class="cart-main">
      <h1>Kurv</h1>

      <section id="kurvContainer" aria-label="Produkter i kurven"></section>

      <section class="cart-summary" aria-labelledby="summaryTitle">
        <h2 id="summaryTitle">Samlet beløb</h2>

        <div class="cart-total">
          <p>Subtotal</p>
          <p id="totalPris">0,00</p>
        </div>

        <a href="productlist.html" class="button"> Fortsæt med at shoppe </a>
      </section>

      <p id="basketStatus" class="cart-status" role="status"></p>
    </main>

    <footer class="footer">
      <a href="index.html" class="footer-logo">ORCHIS</a>
    </footer>
  </body>
</html>
