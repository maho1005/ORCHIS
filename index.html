<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ORCHIS | Find din duft</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="css/index.css" />
    <script src="js/index.js" defer></script>
  </head>

  <body>
    <header class="header">
      <a href="index.html" class="logo" aria-label="ORCHIS – forsiden">
        <img src="images/logo.png" alt="ORCHIS" />
      </a>

      <nav class="navigation" aria-label="Hovednavigation">
        <a href="productlist.html">Shop</a>

        <a href="basket.html" class="kurv" aria-label="Gå til kurv">
          <img src="images/basket.png" alt="" />
        </a>
      </nav>
    </header>

    <main>
      <section class="hero">
        <img src="images/hero.png" alt="" class="hero-image" />

        <div class="hero-content">
          <h1>Find din duft</h1>

          <p>
            Udforsk parfumer med karakter,<br />
            stemning og personlighed.
          </p>

          <a href="productlist.html" class="button"> Shop kollektionen </a>
        </div>
      </section>

      <section class="popular">
        <div class="section-header">
          <h2>Populære produkter</h2>
          <a href="productlist.html" class="see-all">Se alle →</a>
        </div>

        <div id="popularProducts" class="product-grid">
          <p role="status">Indlæser parfumer …</p>
        </div>
      </section>
    </main>

    <footer class="footer">
      <a href="index.html" class="footer-logo">ORCHIS</a>
    </footer>
  </body>
</html>
